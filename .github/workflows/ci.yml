name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: suportai
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: suportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suportai -d suportai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai
      TEST_DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
