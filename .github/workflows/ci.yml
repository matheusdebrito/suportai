name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: suportai
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: suportai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suportai -d suportai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai
      TEST_DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:migrate # Deve ser idempotente sem reaplicar DDL
      - run: npm run typecheck
      - run: npm test
      - run: npm run rag:evaluate -w @suportai/api # dry-run only, zero external requests
      - run: npm run build
      - name: Validate hardened production Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf 'test_password' > "$temp/db_password"
          printf 'postgres://suportai:test_password@db:5432/suportai' > "$temp/database_url"
          : > "$temp/ai_key"
          mkdir -p "$temp/socket"
          export SUPORTAI_DB_PASSWORD_FILE="$temp/db_password"
          export SUPORTAI_DATABASE_URL_FILE="$temp/database_url"
          export SUPORTAI_AI_KEY_FILE="$temp/ai_key"
          export PDF_SOCKET_DIR="$temp/socket"
          export SUPORTAI_DOMAIN=suportai.example.org
          export SUPORTAI_TLS_CONTACT=ti@example.org
          export APP_ORIGIN=https://suportai.example.org
          docker compose -f deploy/compose.production.yml config --quiet
          docker compose -f deploy/compose.production.yml config --format json > "$temp/compose.json"
          node - "$temp/compose.json" <<'NODE'
          const cfg=JSON.parse(require('node:fs').readFileSync(process.argv[2],'utf8'));
          const parser=cfg.services['pdf-parser'];
          if(parser.network_mode!=='none'||parser.read_only!==true||
             parser.user!=='10001:10001'||(parser.secrets||[]).length>0||
             !(parser.cap_drop||[]).includes('ALL'))
             throw new Error('PDF parser lacks mandatory isolation configuration');
          const worker=cfg.services.worker;
          if(!worker.volumes?.some(v=>v.target==='/run/suportai'&&v.read_only))
             throw new Error('Worker parser socket mount must be read-only');
          NODE
      - name: Build and validate production runtime images
        run: |
          docker build -f deploy/Dockerfile --target runtime -t suportai/runtime:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 10001:10001 \
            suportai/runtime:ci node apps/api/dist/pdf-isolation-preflight.js | grep -q "Controles básicos do processo: OK"
          docker run --rm --network none --read-only --user 10001:10001 \
            -e NODE_ENV=production -e APP_ORIGIN=https://suportai.example.test \
            -e DATABASE_URL=postgres://synthetic:synthetic@db/suportai \
            -e ALLOW_EXTERNAL_AI_DATA_PROCESSING=false \
            suportai/runtime:ci node apps/api/dist/preflight.js | grep -q "Configuração mínima: OK"
          docker build -f deploy/Dockerfile --target web -t suportai/web:ci .
          docker run --rm -e SUPORTAI_DOMAIN=suportai.example.org \
            -e SUPORTAI_TLS_CONTACT=ti@example.org --entrypoint caddy \
            suportai/web:ci validate --config /etc/caddy/Caddyfile
      - name: Full local Compose smoke (synthetic credentials)
        run: bash scripts/compose-smoke.sh
      - name: Verify real PDF sandbox and Unix-socket fail-closed behavior
        shell: bash
        run: bash deploy/test-pdf-isolation.sh
      # Browser tests use a different database from request/integration tests.
      - name: Create isolated browser-test database
        run: |
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{
            const client=new Client({connectionString:process.env.DATABASE_URL});
            await client.connect();
            try{await client.query('CREATE DATABASE suportai_e2e');}
            finally{await client.end();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai_e2e
      - run: npm run admin:bootstrap
        env:
          DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai_e2e
          BOOTSTRAP_ADMIN_EMAIL: e2e-admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: E2e-Secure-Password-Example-123!
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          NODE_ENV: development
          DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai_e2e
          TEST_DATABASE_URL: postgres://suportai:test_password@localhost:5432/suportai_e2e
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: E2e-Secure-Password-Example-123!
      - name: Validate PostgreSQL backup and restore (disposable CI databases only)
        shell: bash
        run: |
          set -euo pipefail
          # This is restricted to the ephemeral GitHub Actions PostgreSQL service.
          # No production URL is used; the source database contains synthetic E2E data.
          container="$(docker ps --filter ancestor=pgvector/pgvector:pg17 --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" pg_dump -U suportai -d suportai_e2e --no-owner --no-acl \
            --format=custom --file=/tmp/suportai-ci-backup.dump
          docker exec "$container" pg_restore --list /tmp/suportai-ci-backup.dump > /dev/null
          docker exec "$container" psql -X -v ON_ERROR_STOP=1 -U suportai -d postgres \
            -c 'CREATE DATABASE suportai_restore_ci'
          docker exec "$container" pg_restore --exit-on-error --no-owner --no-acl \
            -U suportai --dbname=suportai_restore_ci /tmp/suportai-ci-backup.dump
          for table in schema_migrations users sessions password_resets departments user_departments spaces space_grants \
            documents document_versions ingestion_jobs knowledge_chunks \
            conversations messages pending_actions feedback audit_events; do
            source_count="$(docker exec "$container" psql -XAt -U suportai -d suportai_e2e -c "SELECT count(*) FROM $table")"
            restored_count="$(docker exec "$container" psql -XAt -U suportai -d suportai_restore_ci -c "SELECT count(*) FROM $table")"
            if [ "$source_count" != "$restored_count" ]; then
              echo "Restore mismatch in $table"
              exit 1
            fi
          done
          # Validate bytea payloads and published-version pointers, not just row counts.
          for sql in \
            "SELECT COALESCE(sum(octet_length(pdf_bytes)),0) FROM document_versions" \
            "SELECT count(*) FROM document_versions WHERE status='PUBLISHED'" \
            "SELECT count(*) FROM documents WHERE current_version_id IS NOT NULL" \
            "SELECT count(*) FROM knowledge_chunks WHERE embedding IS NOT NULL"; do
            before="$(docker exec "$container" psql -XAt -U suportai -d suportai_e2e -c "$sql")"
            after="$(docker exec "$container" psql -XAt -U suportai -d suportai_restore_ci -c "$sql")"
            test "$before" = "$after"
          done
          # pgcrypto/vector and historical migrations must also survive restoration.
          docker exec "$container" psql -XAt -v ON_ERROR_STOP=1 -U suportai \
            -d suportai_restore_ci \
            -c "SELECT CASE WHEN to_regtype('vector') IS NOT NULL AND to_regclass('public.schema_migrations') IS NOT NULL THEN 'ok' ELSE 'fail' END" \
            | grep -qx ok
          echo "Isolated PostgreSQL 17 backup and restore completed successfully"
          # Exercise the operator restore script against the same fictitious dump,
          # in a separate networkless database container (no production server).
          restore_temp="$(mktemp -d)"
          docker cp "$container:/tmp/suportai-ci-backup.dump" "$restore_temp/test.dump"
          mkdir -p "$restore_temp/restores"
          bash deploy/verify-restore.sh "$restore_temp/test.dump" "$restore_temp/restores"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 5
