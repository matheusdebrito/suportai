services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: suportai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: suportai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suportai"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
